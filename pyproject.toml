[project]
name = "axiomeer"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0",
  "pydantic[email]>=2.0",
  "sqlalchemy>=2.0",
  "typer>=0.9",
  "rich>=13.0",
  "requests>=2.31",
  "httpx>=0.27",
  "tenacity>=8.0",
  "python-dotenv>=1.0",
  "sentence-transformers>=2.2.0",
  "faiss-cpu>=1.7.4",
  "numpy>=1.24.0",
  "defusedxml>=0.7.1",
  # Authentication dependencies
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
  "alembic>=1.13.0",
  "psycopg2-binary>=2.9.9",
  "bcrypt==4.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
]
redis = [
  "redis>=5.0",
]
observability = [
  "prometheus-client>=0.20",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "alembic/versions", "sdk/javascript", "Test Images"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PIE", "RET", "SIM"]
ignore = [
  "E501",  # line length handled by formatter
  "S101",  # asserts OK in tests
  "B008",  # FastAPI Depends() in defaults
  "S110",  # deliberate best-effort try/except/pass (cache, cleanup, optional paths)
  "S112",  # deliberate best-effort try/except/continue
  "S311",  # non-crypto random is fine (games, jitter, sampling)
  "S105",  # "bearer"/"token_type" literals flagged as passwords (false positive)
  "S106",  # token_type="bearer" kwarg flagged as password (false positive)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E402"]
"scripts/**" = ["S"]
"apps/api/main.py" = ["E402"]  # logging configured before router imports (deliberate)

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["alembic/versions", "\\.venv", "tests"]
